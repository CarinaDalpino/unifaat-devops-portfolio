name: CI Aula 08 - TechNova API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aula-08

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Testes (Jest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Secret
        run: echo "Regiao - ${{ secrets.AWS_REGION }}"
      - name: Build
        run: docker build -t technova-api:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name tst -p 3000:3000 technova-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3000/health || (docker logs tst; exit 1)
          docker stop tst; docker rm tst
