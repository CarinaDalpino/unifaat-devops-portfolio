name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'aula-10/terraform/**.tf'
      - 'aula-10/terraform/**.tfvars'

permissions:
  contents: read        # Ler código
  pull-requests: write  # Postar comentário no PR

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./aula-10/terraform

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}   # Learner Lab exige
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Postar Plan como comentário no PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = (process.env.PLAN || '').substring(0, 60000);
            const body = `#### Terraform Plan 📖

            | Etapa | Resultado |
            |-------|:---------:|
            | Format (\`fmt\`) | \`${process.env.FMT}\` |
            | Validate | \`${process.env.VALIDATE}\` |
            | Plan | \`${process.env.PLAN_OUTCOME}\` |

            <details><summary>Mostrar saída do plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.event.pull_request.head.ref }}\`*`;

            // Atualiza comentário existente do bot (não duplica) ou cria um novo
            const marker = '#### Terraform Plan 📖';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Falhar se plan falhou
        if: steps.plan.outcome == 'failure'
        run: exit 1
